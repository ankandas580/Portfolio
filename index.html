<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANKAN DAS | Portfolio</title>
    <meta name="description" content="Personal portfolio of Ankan Das.">
    <!-- Custom Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Premium Ambient Glass & Orbs -->
    <div class="background-glass"></div>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Floating Action Buttons -->
    <button id="settings-btn" class="settings-btn" aria-label="Settings" title="Theme Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
        </svg>
    </button>

    <main class="container">
        <!-- Profile Branding Header -->
        <header>
            <div class="avatar-container">
                AD
                <img src="assets/images/profile.png" alt="Profile" onerror="this.style.display='none'" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1 id="portfolio-title">ANKAN DAS</h1>
            <p id="portfolio-tagline">Computer Science Student | Intern at LivNSense GreenOps</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <div class="chips-container" id="tab-nav-container">
                <button class="chip active" data-target="about">🎯 About</button>
                <button class="chip" data-target="skills">💻 Skills</button>
                <button class="chip" data-target="projects">🚀 Projects</button>
                <button class="chip" data-target="experience">💼 Experience</button>
                <button class="chip" data-target="education">🎓 Education</button>
                <button class="chip" data-target="contact">📧 Contact</button>
            </div>
        </nav>

        <!-- Portfolio Sections (Injected via JS) -->
        <div class="portfolio-content">
            <section id="about" class="portfolio-section active"></section>
            <section id="skills" class="portfolio-section"></section>
            <section id="projects" class="portfolio-section"></section>
            <section id="experience" class="portfolio-section"></section>
            <section id="education" class="portfolio-section"></section>
            <section id="contact" class="portfolio-section"></section>
        </div>
    </main>

    <!-- Quick Preferences Modal Overlay -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Preferences</h2>
                <button id="close-settings-btn" class="close-btn" aria-label="Close settings">&times;</button>
            </div>

            <div class="settings-section">
                <h3>Select Color Theme</h3>
                <div class="theme-options">
                    <label class="radio-label">
                        <input type="radio" name="theme" value="auto" checked>
                        <span>Auto (System)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="light">
                        <span>Light</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="dark">
                        <span>Dark</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Toast Banner Notification -->
    <div id="toast" class="toast hidden">Message Sent!</div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
